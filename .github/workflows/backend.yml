name: Backend
on:
  push:
    paths: ["apps/api/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: teapass
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: teapass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teapass -d teapass_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.9.4
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q
        env:
          TEAPASS_TEST_DATABASE_URL: postgresql+psycopg://teapass:local-only@127.0.0.1:5432/teapass_test
