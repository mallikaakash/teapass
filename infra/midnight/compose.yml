# Adapted from the Apache-2.0 Midnight hello-world starter.
# TeaPass: pinned matrix versions, separate project, no verbose prover logs.
name: teapass-midnight
services:
  proof-server:
    image: 'midnightntwrk/proof-server:8.1.3@sha256:0f4ab0716985eaebbe55a970348f52ff05ffd8a96631ed7232bd0c4ba02c115c'
    command: ['midnight-proof-server']
    ports:
      - '127.0.0.1:6300:6300'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    restart: on-failure:5
    image: '${MIDNIGHT_INDEXER_IMAGE:-midnightntwrk/indexer-standalone:4.3.5@sha256:a660227c39d20bc317c718968417847cc97efc6832803154ccf0272c10e75558}'
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:1.0.400@sha256:915b117f955859a0ab7f34230ca12b43ef7474c84e29463256efcfc7b757040f'
    ports:
      - '127.0.0.1:9944:9944'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -H "Content-Type: application/json" -d ''{"jsonrpc":"2.0","id":1,"method":"chain_getBlockHash","params":[2]}'' http://localhost:9944 | grep -q ''"result":"0x''']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
